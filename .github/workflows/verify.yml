name: Verify source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Cross-build desktop hosts
        shell: bash
        run: |
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o "$RUNNER_TEMP/relevo-${target//\//-}" ./cmd/relevo
          done
      - name: Native media portable tests
        shell: bash
        run: |
          python3 drivers/windows-media/tests/test_camera_source.py
          for test in media_bridge camera_canvas microphone_feeder; do
            clang++ -std=c++17 -Wall -Wextra -Werror -pthread -fsanitize=address,undefined -I drivers/windows-media/src "drivers/windows-media/tests/${test}_test.cpp" -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I drivers/windows-media/src drivers/windows-media/tests/microphone_endpoint_c_test.c -o "$RUNNER_TEMP/mic-c"
          "$RUNNER_TEMP/mic-c"
